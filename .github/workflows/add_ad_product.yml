name: Add Ad Product (Manual)

on:
  workflow_dispatch:
    inputs:
      url:
        description: '広告商品のLP URL'
        required: true
      product_id:
        description: '商品ID (例: adp_001)'
        required: true

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install anthropic supabase requests
      - name: Extract and insert product
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/ad_product_extractor.py \
            --url "${{ github.event.inputs.url }}" \
            --id "${{ github.event.inputs.product_id }}"

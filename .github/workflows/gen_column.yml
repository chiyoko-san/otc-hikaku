name: Auto Generate Column

on:
  schedule:
    - cron: "0 12 * * *"   # 毎日21:00 JST（UTC 12:00）
  workflow_dispatch:
    inputs:
      theme:
        description: "テーマ番号（0〜24、空欄=自動）"
        required: false
        default: ""
      dry_run:
        description: "dry-run（APIを呼ばずテーマ確認のみ）"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_images:
        description: "画像生成をスキップする"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: コラム生成
        id: gen_col
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.theme }}" ]; then
            ARGS="$ARGS --theme ${{ github.event.inputs.theme }}"
          fi
          python scraper/gen_column.py $ARGS

          # コラムIDを出力（画像生成に使う）
          TODAY=$(python3 -c "from datetime import datetime,timezone,timedelta; now=datetime.now(timezone(timedelta(hours=9))); slot=0 if now.hour<15 else 1; print(f'auto_{now.strftime(\"%Y%m%d\")}_{slot}')")
          echo "col_id=$TODAY" >> $GITHUB_OUTPUT
          echo "[workflow] コラムID: $TODAY"

      - name: 画像生成
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.skip_images != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_KEY }}
        run: |
          COL_ID="${{ steps.gen_col.outputs.col_id }}"
          echo "[workflow] 画像生成開始: $COL_ID"
          python scraper/gen_images.py --col-id "$COL_ID" || echo "[workflow] 画像生成でエラーが発生しましたが続行します"

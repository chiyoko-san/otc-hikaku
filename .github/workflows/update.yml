name: Weekly PMDA Update
on:
  schedule:
    - cron: "0 17 * * 6"
  workflow_dispatch:
    inputs:
      group:
        description: "取得グループ (hira/kata/alpha/clean/functional/reprocess)"
        required: false
        default: "hira"
        type: choice
        options: ["hira","kata","alpha","clean","functional","reprocess"]
      limit:
        description: "取得件数上限(0=無制限)。reprocessは既定500"
        required: false
        default: "0"
jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Chrome インストール
        if: ${{ github.event.inputs.group != 'functional' && github.event.inputs.group != 'clean' }}
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -q && sudo apt-get install -y google-chrome-stable

      - name: 依存インストール
        run: pip install selenium webdriver-manager requests beautifulsoup4

      - name: git設定
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── PMDAスクレイピング(通常) ──
      - name: PMDAスクレイピング
        if: ${{ github.event.inputs.group != 'functional' && github.event.inputs.group != 'clean' && github.event.inputs.group != 'reprocess' }}
        run: |
          python scraper/pmda_selenium.py \
            --group "${{ github.event.inputs.group || 'hira' }}" \
            --resume \
            --limit ${{ github.event.inputs.limit || '0' }}
        timeout-minutes: 245
        continue-on-error: true

      # ── 既存データの詳細再取得 ──
      # 1ジョブ内で複数ラウンド回す。各ラウンドは220分で自己終了し中間コミット済み。
      # ジョブのtimeout(350分)内で2ラウンド程度進められる。limit=0で全件対象。
      - name: 詳細再取得(reprocess)
        if: ${{ github.event.inputs.group == 'reprocess' }}
        run: |
          python scraper/pmda_selenium.py \
            --reprocess \
            --resume \
            --max-minutes 300 \
            --limit ${{ github.event.inputs.limit || '0' }}
        timeout-minutes: 320
        continue-on-error: true

      # ── 機能性表示食品 ──
      - name: 機能性表示食品スクレイピング
        if: ${{ github.event.inputs.group == 'functional' }}
        run: |
          python scraper/fld_scraper.py \
            --scrape \
            --merge \
            --limit ${{ github.event.inputs.limit || '0' }} \
            --output scraper/medicines.json
        timeout-minutes: 60
        continue-on-error: true

      # ── データクリーニング ──
      - name: ゴミデータ除去・集計
        run: |
          python3 - << 'PYEOF'
          import json, re
          from pathlib import Path
          p = Path('scraper/medicines.json')
          d = json.loads(p.read_text())
          m = d.get('medicines', [])
          clean = [x for x in m
            if x.get('name','') and len(x.get('name','')) >= 2
            and not re.match(r'^PDF\s*[\(\(]', x.get('name',''))
            and not re.match(r'^\d{4}年', x.get('name',''))]
          d['medicines'] = clean
          d['total'] = len(clean)
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2))
          otc  = sum(1 for x in clean if not x.get('itype') or x.get('itype')=='otc')
          func = sum(1 for x in clean if x.get('itype')=='functional')
          quas = sum(1 for x in clean if x.get('itype')=='quasi')
          has_detail = sum(1 for x in clean if x.get('effect') or x.get('ings'))
          print(f'合計{len(clean)}件 (OTC:{otc} 機能性:{func} 医薬部外品:{quas})')
          print(f'詳細取得済み: {has_detail}件 ({has_detail/len(clean)*100:.1f}%)')
          PYEOF

      # ── クロール健全性チェック（壊れたら気づく仕組み） ──
      # scraper が書き出す scrape_stats.json を読み、PMDAから1件も取れて
      # いない等の異常を検知したらジョブを失敗させ、GitHubから通知する。
      - name: クロール健全性チェック
        if: ${{ github.event.inputs.group != 'functional' && github.event.inputs.group != 'clean' }}
        run: |
          python3 - << 'PYEOF'
          import json, os, sys
          from pathlib import Path
          p = Path('scraper/scrape_stats.json')
          if not p.exists():
              print('::warning::scrape_stats.json がありません（scraperが途中で落ちた可能性）')
              sys.exit(1)
          s = json.loads(p.read_text())
          summary = (
              f"mode={s.get('mode')} group={s.get('group')} "
              f"raw_found={s.get('raw_found')} new={s.get('new_items')} "
              f"updated={s.get('updated_items')} total={s.get('total_after')} "
              f"healthy={s.get('healthy')}"
          )
          print(summary)
          # GitHub Actions のジョブサマリに出す
          gs = os.environ.get('GITHUB_STEP_SUMMARY')
          if gs:
              with open(gs, 'a', encoding='utf-8') as f:
                  f.write(f"### PMDAクロール結果\n\n{summary}\n\n")
                  if not s.get('healthy'):
                      f.write(f"⚠ **異常検知**: {s.get('reason')}\n")
          if not s.get('healthy'):
              print(f"::error::クロール異常: {s.get('reason')}")
              sys.exit(1)
          PYEOF

      # ── data/medicines.json への同期(Next.js が読むため) ──
      - name: data/medicines.json へ同期
        if: ${{ always() }}
        run: |
          mkdir -p data
          cp scraper/medicines.json data/medicines.json
          echo "[sync] data/medicines.json updated"

      # ── コミット(競合時リトライあり・最大3回) ──
      # 健全性チェックが失敗した場合はこのステップは実行されない（success()既定）
      # ため、壊れた/空のデータがコミットされることはない。
      - name: コミット
        if: ${{ success() }}
        run: |
          git add scraper/medicines.json data/medicines.json
          COUNT=$(python3 -c "import json;d=json.load(open('scraper/medicines.json'));print(d.get('total',0))")
          GROUP="${{ github.event.inputs.group || 'scheduled' }}"

          # 変更がなければ正常終了
          if git diff --staged --quiet; then
            echo "[commit] no changes, skipping"
            exit 0
          fi

          git commit -m "update(${GROUP}): ${COUNT}件"

          # push リトライ(競合時は最新を取り込んで再試行)
          for i in 1 2 3; do
            echo "[push] attempt $i"
            git pull --rebase origin main 2>/dev/null || true
            if git push origin main; then
              echo "[push] success on attempt $i"
              exit 0
            fi
            echo "[push] failed on attempt $i, retrying in 5 sec..."
            sleep 5
          done
          echo "[push] failed after 3 attempts"
          exit 1

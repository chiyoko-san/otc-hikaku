name: PMDA monthly update

# 毎月2日の午前3時(日本時間)に実行。Actionsタブから手動実行も可能
on:
  schedule:
    - cron: '0 18 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリ
        run: pip install requests beautifulsoup4

      - name: PMDA月次更新
        run: python scraper/pmda_monthly.py --run

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/medicines.json data/updates/
          if git diff --cached --quiet; then
            echo "変更なし。コミットしません。"
          else
            git commit -m "PMDA月次更新 $(date +%Y-%m)"
            git push
          fi

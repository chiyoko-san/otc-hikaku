<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>投稿管理 [試験公開] | クスリノコンパス</title>
<style>
* { box-sizing: border-box; }
body {
  --bg: #1a1a1a;
  --ink: #faf7f2;
  --sub: #a8a8a8;
  --accent: #c8342e;
  --accent2: #ffd166;
  --line: #3a3a3a;
  --card: #262626;
  --ok: #2d6a4f;
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "SF Mono", "Monaco", "Courier New", monospace;
  font-size: 13px; line-height: 1.6;
}
.topbar {
  background: #000; color: var(--ink);
  padding: 14px 24px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--line);
}
.topbar h1 {
  font-size: 14px; margin: 0;
  letter-spacing: 0.2em; font-weight: 700;
}
.topbar h1 span { color: var(--accent2); }
.auth { display: flex; gap: 12px; align-items: center; }
.auth button {
  background: var(--accent2); color: #000;
  border: none; padding: 6px 14px; cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: 700;
}
.wrap { max-width: 1400px; margin: 0 auto; padding: 24px; }
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1px; background: var(--line);
  border: 1px solid var(--line); margin-bottom: 24px;
}
.stat-box { background: var(--card); padding: 20px; }
.stat-num {
  font-size: 28px; font-weight: 700;
  color: var(--accent2); margin-bottom: 4px;
}
.stat-label {
  font-size: 10px; color: var(--sub);
  letter-spacing: 0.15em; text-transform: uppercase;
}
.filter-bar {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-bottom: 20px; align-items: center;
}
.filter-btn {
  background: transparent; color: var(--ink);
  border: 1px solid var(--line); padding: 6px 12px;
  font-family: inherit; font-size: 11px; cursor: pointer;
  letter-spacing: 0.05em;
}
.filter-btn.active {
  background: var(--accent2); color: #000;
  border-color: var(--accent2);
}
.filter-label {
  font-size: 10px; color: var(--sub);
  margin-right: 4px; letter-spacing: 0.1em;
}
.sighting-grid { display: grid; gap: 12px; }
.sighting {
  background: var(--card); border: 1px solid var(--line);
  padding: 18px;
  display: grid;
  grid-template-columns: 40px 1fr auto;
  gap: 18px; align-items: start;
}
.sighting.reviewed { opacity: 0.5; }
.sighting-num { font-size: 11px; color: var(--sub); padding-top: 4px; }
.sighting-main { font-size: 13px; }
.sighting-header {
  display: flex; gap: 8px; align-items: center;
  margin-bottom: 8px; flex-wrap: wrap;
}
.badge {
  display: inline-block; padding: 2px 8px;
  font-size: 10px; letter-spacing: 0.1em;
  background: var(--line); color: var(--ink);
}
.badge.media { background: #3a4a5c; }
.badge.cat { background: #5c3a3a; color: var(--accent2); }
.badge.reviewed { background: var(--ok); color: #fff; }
.sighting-title {
  font-size: 15px; font-weight: 700;
  color: var(--accent2); margin-bottom: 4px;
}
.sighting-body { color: var(--sub); }
.sighting-body dt {
  font-size: 10px; color: var(--accent);
  letter-spacing: 0.1em; margin-top: 10px;
  text-transform: uppercase;
}
.sighting-body dd {
  margin: 3px 0 0 0; color: var(--ink);
  font-family: "Noto Serif JP", "Yu Mincho", serif;
  line-height: 1.8;
}
.sighting-body a {
  color: var(--accent2); text-decoration: none;
  word-break: break-all;
}
.sighting-body a:hover { text-decoration: underline; }
.sighting-meta {
  font-size: 10px; color: var(--sub);
  margin-top: 10px; letter-spacing: 0.05em;
}
.sighting-actions {
  display: flex; flex-direction: column; gap: 6px;
}
.action-btn {
  background: transparent; color: var(--ink);
  border: 1px solid var(--line); padding: 6px 10px;
  font-family: inherit; font-size: 11px; cursor: pointer;
  letter-spacing: 0.05em; white-space: nowrap;
  text-decoration: none; text-align: center;
  display: block;
}
.action-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.action-btn.review { border-color: var(--ok); color: var(--ok); }
.action-btn.review:hover { background: var(--ok); color: #fff; }
#login-screen {
  display: flex; justify-content: center;
  align-items: center; min-height: 80vh;
}
#login-box {
  background: var(--card); padding: 40px;
  border: 1px solid var(--line);
  max-width: 400px; width: 100%;
}
#login-box h2 { margin: 0 0 20px; }
#login-box input {
  width: 100%; padding: 10px;
  background: transparent; color: var(--ink);
  border: 1px solid var(--line); font-family: inherit;
  margin-bottom: 16px;
}
#login-box button {
  width: 100%; padding: 12px;
  background: var(--accent2); color: #000;
  border: none; cursor: pointer; font-family: inherit;
  font-weight: 700; letter-spacing: 0.1em;
}
.login-err {
  color: var(--accent); font-size: 12px;
  margin-top: 10px; display: none;
}
.empty { text-align: center; padding: 60px; color: var(--sub); }
.meta-links {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--line);
  font-size: 10px;
}
.meta-links a {
  color: var(--sub); margin-right: 12px;
  text-decoration: none;
}
.meta-links a:hover { color: var(--accent2); }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h2>ADMIN ACCESS</h2>
    <input type="password" id="admin-key" placeholder="Admin Key (service_role)">
    <button onclick="login()">ログイン</button>
    <div class="login-err" id="login-err">認証に失敗しました。</div>
  </div>
</div>

<div id="admin-ui" style="display:none;">
  <div class="topbar">
    <h1>AD SIGHTINGS <span>/</span> ADMIN CONSOLE</h1>
    <div class="auth">
      <button onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="wrap">
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num">-</div><div class="stat-label">Total</div></div>
      <div class="stat-box"><div class="stat-num">-</div><div class="stat-label">Unreviewed</div></div>
      <div class="stat-box"><div class="stat-num">-</div><div class="stat-label">This Week</div></div>
      <div class="stat-box"><div class="stat-num">-</div><div class="stat-label">This Month</div></div>
    </div>

    <div class="filter-bar">
      <span class="filter-label">STATUS</span>
      <button class="filter-btn active" data-status="unreviewed">未確認のみ</button>
      <button class="filter-btn" data-status="all">すべて</button>
      <button class="filter-btn" data-status="reviewed">確認済みのみ</button>
      <span class="filter-label" style="margin-left:16px;">CATEGORY</span>
      <button class="filter-btn active" data-cat="all">ALL</button>
      <button class="filter-btn" data-cat="diet">diet</button>
      <button class="filter-btn" data-cat="hair">hair</button>
      <button class="filter-btn" data-cat="joint">joint</button>
      <button class="filter-btn" data-cat="sleep">sleep</button>
      <button class="filter-btn" data-cat="eye">eye</button>
      <button class="filter-btn" data-cat="beauty">beauty</button>
      <button class="filter-btn" data-cat="other">other</button>
    </div>

    <div class="sighting-grid" id="sighting-grid">
      <div class="empty">読み込み中…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SB_URL = 'https://glxhggfxxwpfmwqoulyy.supabase.co';
  let SB_KEY = null;
  let sb = null;

  function login() {
    const key = document.getElementById('admin-key').value.trim();
    if (!key || !key.startsWith('eyJ')) {
      document.getElementById('login-err').style.display = 'block';
      return;
    }
    SB_KEY = key;
    sb = supabase.createClient(SB_URL, SB_KEY);
    sessionStorage.setItem('_admin_key', key);
    showAdmin();
  }

  function logout() {
    sessionStorage.removeItem('_admin_key');
    location.reload();
  }

  function showAdmin() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-ui').style.display = 'block';
    loadData();
  }

  const saved = sessionStorage.getItem('_admin_key');
  if (saved) {
    SB_KEY = saved;
    sb = supabase.createClient(SB_URL, SB_KEY);
    showAdmin();
  }
</script>

<script>
(() => {
  'use strict';
  let allSightings = [];
  let filterStatus = 'unreviewed';
  let filterCat = 'all';

  const MEDIA_LABEL = {
    instagram: 'Instagram', youtube: 'YouTube', tiktok: 'TikTok',
    x: 'X', facebook: 'Facebook', google_search: 'Google検索',
    yahoo_search: 'Yahoo検索', other: 'その他'
  };

  window.loadData = async function() {
    if (!sb) return;
    const { data, error } = await sb
      .from('ad_sightings')
      .select('*')
      .order('submitted_at', { ascending: false });
    if (error) {
      document.getElementById('sighting-grid').innerHTML =
        '<div class="empty">読み込み失敗: ' + error.message + '</div>';
      return;
    }
    allSightings = data || [];
    renderStats();
    render();
  };

  function renderStats() {
    const now = new Date();
    const wk = new Date(now - 7*24*3600*1000);
    const mo = new Date(now - 30*24*3600*1000);
    const unreviewed = allSightings.filter(s => !s.is_reviewed).length;
    const weekCount = allSightings.filter(s => new Date(s.submitted_at) > wk).length;
    const monthCount = allSightings.filter(s => new Date(s.submitted_at) > mo).length;
    const boxes = document.querySelectorAll('.stat-box .stat-num');
    boxes[0].textContent = allSightings.length;
    boxes[1].textContent = unreviewed;
    boxes[2].textContent = weekCount;
    boxes[3].textContent = monthCount;
  }

  function filtered() {
    return allSightings.filter(s => {
      if (filterStatus === 'unreviewed' && s.is_reviewed) return false;
      if (filterStatus === 'reviewed' && !s.is_reviewed) return false;
      if (filterCat !== 'all' && s.category !== filterCat) return false;
      return true;
    });
  }

  function render() {
    const list = filtered();
    const grid = document.getElementById('sighting-grid');
    if (list.length === 0) {
      grid.innerHTML = '<div class="empty">該当する投稿がありません</div>';
      return;
    }
    grid.innerHTML = list.map((s, i) => renderSighting(s, i+1)).join('');
  }

  function esc(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  function renderSighting(s, n) {
    const searchTerm = s.product_name || s.product_hint || '';
    const metaLibUrl = 'https://www.facebook.com/ads/library/?active_status=all&ad_type=all&country=JP&q=' +
                      encodeURIComponent(searchTerm);
    const googleSearchUrl = 'https://www.google.com/search?q=' +
                      encodeURIComponent((s.product_name || s.ad_copy || '') + ' 定期 解約');
    const tiktokSearchUrl = 'https://library.tiktok.com/ads?region=JP&q=' +
                      encodeURIComponent(searchTerm);
    const date = new Date(s.submitted_at);
    const dateStr = date.getFullYear() + '-' +
      String(date.getMonth()+1).padStart(2,'0') + '-' +
      String(date.getDate()).padStart(2,'0') + ' ' +
      String(date.getHours()).padStart(2,'0') + ':' +
      String(date.getMinutes()).padStart(2,'0');

    return `
      <article class="sighting ${s.is_reviewed ? 'reviewed' : ''}">
        <div class="sighting-num">#${s.id}</div>
        <div class="sighting-main">
          <div class="sighting-header">
            ${s.media ? `<span class="badge media">${MEDIA_LABEL[s.media]||s.media}</span>` : ''}
            ${s.category ? `<span class="badge cat">${s.category}</span>` : ''}
            ${s.is_reviewed ? `<span class="badge reviewed">REVIEWED</span>` : ''}
          </div>
          ${s.product_name ? `<div class="sighting-title">${esc(s.product_name)}</div>` : ''}
          <dl class="sighting-body">
            ${s.product_hint ? `<dt>特徴</dt><dd>${esc(s.product_hint)}</dd>` : ''}
            ${s.ad_copy ? `<dt>訴求文</dt><dd>${esc(s.ad_copy)}</dd>` : ''}
            ${s.concerns ? `<dt>気になった点</dt><dd>${esc(s.concerns)}</dd>` : ''}
            ${s.lp_url ? `<dt>LP URL</dt><dd><a href="${esc(s.lp_url)}" target="_blank" rel="noopener">${esc(s.lp_url)}</a></dd>` : ''}
            ${s.review_note ? `<dt>管理メモ</dt><dd>${esc(s.review_note)}</dd>` : ''}
          </dl>
          <div class="meta-links">
            ${searchTerm ? `
              <a href="${metaLibUrl}" target="_blank" rel="noopener">→ Meta Ad Library で検索</a>
              <a href="${tiktokSearchUrl}" target="_blank" rel="noopener">→ TikTok Ads Library</a>
              <a href="${googleSearchUrl}" target="_blank" rel="noopener">→ Google で "定期 解約" 検索</a>
            ` : ''}
          </div>
          <div class="sighting-meta">
            投稿日時: ${dateStr}
            ${s.linked_product_id ? ` / 紐付け商品ID: ${s.linked_product_id}` : ''}
          </div>
        </div>
        <div class="sighting-actions">
          ${!s.is_reviewed ? `
            <button class="action-btn review" onclick="markReviewed(${s.id})">✓ 確認済み</button>
            <button class="action-btn" onclick="linkProduct(${s.id})">商品IDに紐付け</button>
          ` : `
            <button class="action-btn" onclick="unmarkReviewed(${s.id})">未確認に戻す</button>
          `}
          <button class="action-btn" onclick="deleteSighting(${s.id})" style="border-color:#c8342e;color:#c8342e;">削除</button>
        </div>
      </article>
    `;
  }

  window.markReviewed = async function(id) {
    const note = prompt('管理メモ (任意・Enterで省略):') || '';
    const { error } = await sb.from('ad_sightings')
      .update({
        is_reviewed: true,
        reviewed_at: new Date().toISOString(),
        review_note: note || null,
      })
      .eq('id', id);
    if (error) { alert('失敗: ' + error.message); return; }
    loadData();
  };

  window.unmarkReviewed = async function(id) {
    const { error } = await sb.from('ad_sightings')
      .update({ is_reviewed: false, reviewed_at: null })
      .eq('id', id);
    if (error) { alert('失敗: ' + error.message); return; }
    loadData();
  };

  window.linkProduct = async function(id) {
    const pid = prompt('紐付ける商品ID (例: adp_001):');
    if (!pid) return;
    const { error } = await sb.from('ad_sightings')
      .update({
        linked_product_id: pid.trim(),
        is_reviewed: true,
        reviewed_at: new Date().toISOString(),
      })
      .eq('id', id);
    if (error) { alert('失敗: ' + error.message); return; }
    loadData();
  };

  window.deleteSighting = async function(id) {
    if (!confirm('この投稿を削除しますか? (取り消せません)')) return;
    const { error } = await sb.from('ad_sightings').delete().eq('id', id);
    if (error) { alert('失敗: ' + error.message); return; }
    loadData();
  };

  document.querySelectorAll('[data-status]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-status]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterStatus = btn.dataset.status;
      render();
    });
  });
  document.querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCat = btn.dataset.cat;
      render();
    });
  });
})();
</script>
</body>
</html>
